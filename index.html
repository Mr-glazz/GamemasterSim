<script>
/* ============================================================
   TITANS FRANCHISE — CAREFUL ENGINE IMPROVEMENT LAYER
   ------------------------------------------------------------
   IMPORTANT:
   This layer PRESERVES the existing engine.
   It does not replace:
     - existing roster generation
     - existing match simulation
     - existing blueprint engine
     - existing market engine
     - existing UI navigation

   It only adds missing management/match/team functionality.
   ============================================================ */

(function () {
    "use strict";

    /* ============================================================
       PLAYER MANAGEMENT EXTENSIONS
       ============================================================ */

    window.playerSeasonStats = window.playerSeasonStats || {};
    window.matchArchive = window.matchArchive || [];
    window.teamPages = window.teamPages || {};

    /*
     * Creates a stats container only when one does not already exist.
     * Existing stats are never overwritten.
     */
    window.ensurePlayerSeasonStats = function (playerId) {

        if (!playerId) return null;

        if (!window.playerSeasonStats[playerId]) {
            window.playerSeasonStats[playerId] = {
                games: 0,
                starts: 0,
                minutes: 0,
                points: 0,
                rebounds: 0,
                assists: 0,
                steals: 0,
                blocks: 0,
                turnovers: 0,
                fouls: 0,
                fgMade: 0,
                fgAttempted: 0,
                threeMade: 0,
                threeAttempted: 0,
                ftMade: 0,
                ftAttempted: 0,
                plusMinus: 0
            };
        }

        return window.playerSeasonStats[playerId];
    };


    /* ============================================================
       SEASON STAT RECORDING
       ============================================================ */

    window.recordPlayerGameStats = function (playerId, gameStats) {

        var stats = window.ensurePlayerSeasonStats(playerId);

        if (!stats || !gameStats) return;

        stats.games += Number(gameStats.games || 1);
        stats.starts += Number(gameStats.starts || 0);
        stats.minutes += Number(gameStats.minutes || 0);
        stats.points += Number(gameStats.points || 0);
        stats.rebounds += Number(gameStats.rebounds || 0);
        stats.assists += Number(gameStats.assists || 0);
        stats.steals += Number(gameStats.steals || 0);
        stats.blocks += Number(gameStats.blocks || 0);
        stats.turnovers += Number(gameStats.turnovers || 0);
        stats.fouls += Number(gameStats.fouls || 0);

        stats.fgMade += Number(gameStats.fgMade || 0);
        stats.fgAttempted += Number(gameStats.fgAttempted || 0);

        stats.threeMade += Number(gameStats.threeMade || 0);
        stats.threeAttempted += Number(gameStats.threeAttempted || 0);

        stats.ftMade += Number(gameStats.ftMade || 0);
        stats.ftAttempted += Number(gameStats.ftAttempted || 0);

        stats.plusMinus += Number(gameStats.plusMinus || 0);
    };


    /* ============================================================
       PLAYER CARD — SEASON STAT DISPLAY
       ============================================================ */

    window.buildSeasonStatsHTML = function (playerId) {

        var s = window.ensurePlayerSeasonStats(playerId);

        if (!s) {
            return `
                <div class="card">
                    <strong>Season Statistics</strong>
                    <div style="color:var(--text-muted);margin-top:8px;">
                        No games recorded yet.
                    </div>
                </div>
            `;
        }

        var fg =
            s.fgAttempted > 0
                ? ((s.fgMade / s.fgAttempted) * 100).toFixed(1)
                : "0.0";

        var three =
            s.threeAttempted > 0
                ? ((s.threeMade / s.threeAttempted) * 100).toFixed(1)
                : "0.0";

        var ft =
            s.ftAttempted > 0
                ? ((s.ftMade / s.ftAttempted) * 100).toFixed(1)
                : "0.0";

        return `
            <div class="card" style="margin-top:15px;">

                <h3 style="margin-top:0;">
                    Season Statistics
                </h3>

                <div style="
                    display:grid;
                    grid-template-columns:repeat(4,1fr);
                    gap:8px;
                ">

                    <div>
                        <strong>${s.games}</strong>
                        <small>GP</small>
                    </div>

                    <div>
                        <strong>${s.minutes}</strong>
                        <small>MIN</small>
                    </div>

                    <div>
                        <strong>${s.points}</strong>
                        <small>PTS</small>
                    </div>

                    <div>
                        <strong>${s.rebounds}</strong>
                        <small>REB</small>
                    </div>

                    <div>
                        <strong>${s.assists}</strong>
                        <small>AST</small>
                    </div>

                    <div>
                        <strong>${s.steals}</strong>
                        <small>STL</small>
                    </div>

                    <div>
                        <strong>${s.blocks}</strong>
                        <small>BLK</small>
                    </div>

                    <div>
                        <strong>${s.turnovers}</strong>
                        <small>TOV</small>
                    </div>

                    <div>
                        <strong>${fg}%</strong>
                        <small>FG</small>
                    </div>

                    <div>
                        <strong>${three}%</strong>
                        <small>3PT</small>
                    </div>

                    <div>
                        <strong>${ft}%</strong>
                        <small>FT</small>
                    </div>

                    <div>
                        <strong>${s.plusMinus}</strong>
                        <small>+/-</small>
                    </div>

                </div>
            </div>
        `;
    };


    /* ============================================================
       PLAYER MANAGEMENT
       RELEASE = FREE AGENCY
       FIRE = RETIREMENT
       ============================================================ */

    window.releasePlayerToFreeAgency = function (playerId) {

        if (!playerId) return;

        /*
         * Use the existing engine's release function if it exists.
         * This is critical: we do NOT replace your roster engine.
         */
        if (typeof window.releasePlayer === "function") {
            window.releasePlayer(playerId);
            return;
        }

        if (typeof window.movePlayerToFreeAgency === "function") {
            window.movePlayerToFreeAgency(playerId);
            return;
        }

        console.log(
            "[Roster] Release requested for:",
            playerId
        );

        alert(
            "Release requested. Connect this button to the existing roster/free-agency handler."
        );
    };


    window.retirePlayer = function (playerId) {

        if (!playerId) return;

        /*
         * "Fire" means RETIRE in our system.
         * It does NOT mean free agency.
         */
        if (typeof window.retirePlayerFromRoster === "function") {
            window.retirePlayerFromRoster(playerId);
            return;
        }

        if (typeof window.removePlayerFromRoster === "function") {
            window.removePlayerFromRoster(playerId, "retired");
            return;
        }

        console.log(
            "[Roster] Retirement requested for:",
            playerId
        );

        alert(
            "Retirement requested. Connect this button to the existing retirement handler."
        );
    };


    /* ============================================================
       MASTERBALL CARD MANAGEMENT BUTTONS
       ============================================================ */

    window.buildPlayerManagementButtons = function (playerId) {

        return `
            <div style="
                display:flex;
                gap:8px;
                margin-top:15px;
                flex-wrap:wrap;
            ">

                <button
                    class="btn"
                    onclick="releasePlayerToFreeAgency('${playerId}')">
                    Release to Free Agency
                </button>

                <button
                    class="btn btn-danger"
                    onclick="
                        if(confirm(
                            'Retire this player permanently? This cannot be treated as a free-agent release.'
                        )){
                            retirePlayer('${playerId}');
                        }
                    ">
                    Retire Player
                </button>

            </div>
        `;
    };


    /* ============================================================
       MATCH ARCHIVE
       ------------------------------------------------------------
       Existing match engine remains responsible for determining
       the result. This simply stores the completed result so it
       can be viewed again.
       ============================================================ */

    window.archiveCompletedMatch = function (matchData) {

        if (!matchData) return null;

        var archived = {
            id:
                matchData.id ||
                ("MATCH-" + Date.now() + "-" +
                 Math.floor(Math.random() * 1000)),

            week: matchData.week || 1,

            homeTeam: matchData.homeTeam || "Home Team",
            awayTeam: matchData.awayTeam || "Away Team",

            homeScore: Number(matchData.homeScore || 0),
            awayScore: Number(matchData.awayScore || 0),

            completedAt:
                matchData.completedAt ||
                new Date().toISOString(),

            possessions:
                Array.isArray(matchData.possessions)
                    ? matchData.possessions.slice()
                    : [],

            playerStats:
                matchData.playerStats || {},

            blueprint:
                matchData.blueprint || null
        };

        window.matchArchive.push(archived);

        return archived;
    };


    /* ============================================================
       MATCH REPLAY
       ------------------------------------------------------------
       Replay uses the completed archived game.
       It does NOT reroll the official outcome.
       ============================================================ */

    window.replayArchivedMatch = function (matchId) {

        var match =
            window.matchArchive.find(function (m) {
                return m.id === matchId;
            });

        if (!match) {
            console.warn(
                "[Replay] Match not found:",
                matchId
            );
            return;
        }

        /*
         * If the existing viewer already has a replay function,
         * let that system handle it.
         */
        if (typeof window.playMatchReplay === "function") {
            window.playMatchReplay(match);
            return;
        }

        if (typeof window.startMatchReplay === "function") {
            window.startMatchReplay(match);
            return;
        }

        /*
         * Safe fallback: display the final archived result.
         * No new result is generated.
         */
        var log =
            document.getElementById("m-log");

        if (log) {

            log.innerHTML = `
                <b>[MATCH REPLAY]</b><br>
                ${match.homeTeam}
                <strong>${match.homeScore}</strong>
                -
                <strong>${match.awayScore}</strong>
                ${match.awayTeam}

                <br><br>
                <span style="color:var(--text-muted);">
                    Official result preserved.
                    Replay uses the recorded match sequence.
                </span>
            `;
        }
    };


    /* ============================================================
       TEAM PAGE DATA LAYER
       ------------------------------------------------------------
       The visual page can use the existing layout.
       This does not impose a new UI design.
       ============================================================ */

    window.createTeamPageData = function (team) {

        if (!team) return null;

        var page = {

            id: team.id,

            name: team.name || "Franchise",

            rating:
                Number(team.rating || team.ovr || 0),

            cash:
                Number(team.cash || team.walletCash || 0),

            record: {
                wins:
                    Number(
                        team.wins ||
                        (team.record && team.record.wins) ||
                        0
                    ),

                losses:
                    Number(
                        team.losses ||
                        (team.record && team.record.losses) ||
                        0
                    )
            },

            roster:
                Array.isArray(team.roster)
                    ? team.roster
                    : [],

            blueprint:
                team.blueprint || null,

            schedule:
                Array.isArray(team.schedule)
                    ? team.schedule
                    : [],

            recentGames:
                Array.isArray(team.recentGames)
                    ? team.recentGames
                    : [],

            upcomingGames:
                Array.isArray(team.upcomingGames)
                    ? team.upcomingGames
                    : [],

            training:
                team.training || null,

            agency:
                team.agency || null
        };

        window.teamPages[team.id] = page;

        return page;
    };


    /* ============================================================
       TEAM GAME VIEW
       ============================================================ */

    window.showTeamGame = function (matchId) {

        var match =
            window.matchArchive.find(function (m) {
                return m.id === matchId;
            });

        if (!match) return;

        /*
         * If match is complete, show replay.
         * Otherwise existing live match engine handles it.
         */
        if (
            typeof match.homeScore === "number" &&
            typeof match.awayScore === "number"
        ) {
            window.replayArchivedMatch(matchId);
        }
    };


    /* ============================================================
       BLUEPRINT-AWARE MATCH RECORD
       ------------------------------------------------------------
       The match engine remains authoritative.
       This simply records which blueprint was active.
       ============================================================ */

    window.captureActiveBlueprintForMatch = function () {

        var offense =
            document.getElementById("blueprint-offense");

        var defense =
            document.getElementById("blueprint-defense");

        return {
            offense:
                offense
                    ? offense.value
                    : null,

            defense:
                defense
                    ? defense.value
                    : null
        };
    };


    /* ============================================================
       IQ PROTECTION
       ------------------------------------------------------------
       IQ is earned. This layer never randomly changes it.
       ============================================================ */

    window.getProtectedMatchIQ = function (player) {

        if (!player) return 0;

        return Number(
            player.matchIQ ||
            player.iq ||
            player.IQ ||
            0
        );
    };


    /*
     * RNG may influence an individual play, but this helper prevents
     * an external "random stat mutation" from changing permanent IQ.
     */
    window.applyGameVariance = function (baseValue, variance) {

        var base = Number(baseValue || 0);
        var v = Number(variance || 0);

        return Math.max(1, base + v);
    };


    /* ============================================================
       ROOKIE MATCH CLOCK
       ------------------------------------------------------------
       Rookie games = two 12-minute halves.
       Existing professional match clock remains untouched.
       ============================================================ */

    window.ROOKIE_MATCH_CONFIG = {
        halves: 2,
        minutesPerHalf: 12,
        totalMinutes: 24
    };


    window.getRookieMatchClock = function () {

        return {
            halves: 2,
            minutesPerHalf: 12,
            totalMinutes: 24
        };
    };


    /* ============================================================
       COLLEGE AGE / RARITY HELPERS
       ------------------------------------------------------------
       College age sweet spot:
         18-22

       17 = extremely rare

       College players do NOT receive:
         - special skills
         - Diamond
         - other special gem tiers

       unless they are rookies/draftees governed by the separate
       rookie-generation rules.
       ============================================================ */

    window.getCollegeAgeClass = function (age) {

        age = Number(age);

        if (age === 17) {
            return "EXTREMELY_RARE";
        }

        if (age >= 18 && age <= 22) {
            return "SWEET_SPOT";
        }

        if (age >= 23 && age <= 25) {
            return "LATE_COLLEGE";
        }

        return "OUTSIDE_STANDARD_COLLEGE_RANGE";
    };


    window.isStandardCollegeProspect = function (player) {

        if (!player) return false;

        var age = Number(player.age);

        return age >= 18 && age <= 25;
    };


    /* ============================================================
       COLLEGE SKILL CEILING SAFETY
       ------------------------------------------------------------
       Does NOT modify existing ratings.
       This is only a validation helper for newly generated
       college players.
       ============================================================ */

    window.validateCollegeProspect = function (player) {

        if (!player) return player;

        /*
         * College prospects cannot inherit special skill/badge
         * systems from unrelated generation pools.
         */
        if (player.source === "college") {

            player.specialSkill =
                undefined;

            player.specialSkills =
                [];

            player.diamond =
                false;
        }

        return player;
    };


    /* ============================================================
       MARKET / RECOUPMENT
       ------------------------------------------------------------
       Universal rule.
       No Rivers-specific dependency.
       Existing market engine remains authoritative.
       ============================================================ */

    window.getRecoupmentStatus = function (player) {

        if (!player) {
            return {
                recouped: false,
                progress: 0
            };
        }

        var acquisition =
            Number(
                player.acquisitionPrice ||
                player.purchasePrice ||
                player.price ||
                0
            );

        var revenue =
            Number(
                player.franchiseRevenueGenerated ||
                player.recoupRevenue ||
                0
            );

        if (acquisition <= 0) {
            return {
                recouped: true,
                progress: 100
            };
        }

        var required =
            acquisition * 0.50;

        var progress =
            Math.min(
                100,
                (revenue / required) * 100
            );

        return {
            recouped: revenue >= required,
            progress: progress,
            required: required,
            revenue: revenue
        };
    };


    /* ============================================================
       SAFE INITIALIZATION
       ============================================================ */

    window.TitansImprovementLayer = {
        version: "1.0",
        preservedEngine: true,
        matchReplay: true,
        seasonStats: true,
        playerManagement: true,
        teamPages: true,
        rookieClock: true,
        collegeValidation: true,
        recoupmentUniversal: true
    };

    console.log(
        "[Titans] Improvement layer loaded. Existing engine preserved."
    );

})();
</script>
