    function randomItem(arr) {

        return arr[

    function randomInt(min,max) {

        return Math.floor(
            Math.random() * (max - min + 1)
        ) + min;

            randomItem(firstNames) +
            " " +

        state.nextPlayerId++;

        return state.nextPlayerId;

       ======================================================== */

    function universityTier() {

        var roll = Math.random();

        if (roll < .04)
            return "PLATINUM";

        if (roll < .15)
            return "GOLD";

        if (roll < .34)
            return "EMERALD";

        if (roll < .57)
            return "OPAL";

        if (roll < .76)
            return "SILVER";

        if (roll < .90)
            return "COPPER";

        return "TIN";

    }


    function youthTier() {

        var roll = Math.random();

        if (roll < .0005)
            return "RED DIAMOND";

        if (roll < .0020)
            return "BLACK DIAMOND";

        if (roll < .0060)
            return "WHITE DIAMOND";

        if (roll < .03)
            return "PLATINUM";

        if (roll < .12)
            return "GOLD";

        if (roll < .30)
            return "EMERALD";

        if (roll < .55)
            return "OPAL";

        if (roll < .75)
            return "SILVER";

        return "COPPER";

    }


    function professionalTier() {

        var roll = Math.random();

        if (roll < .0002)
            return "RED DIAMOND";

        if (roll < .001)
            return "BLACK DIAMOND";

        if (roll < .005)
            return "WHITE DIAMOND";

        if (roll < .025)
            return "PLATINUM";

        if (roll < .12)
            return "GOLD";

        if (roll < .35)
            return "EMERALD";

        if (roll < .58)
            return "OPAL";

        if (roll < .75)
            return "SILVER";

        return "COPPER";

    }


    /* ========================================================
       PLAYER GENERATOR
       ======================================================== */

    function createPlayer(origin) {

        var tier;

        if (origin === "university") {

            tier = universityTier();

        }
        else if (origin === "youth") {

            tier = youthTier();

        }
        else {

            tier = professionalTier();

        }


        var tierData = tiers.find(function(t) {

            return t.name === tier;

        });


        var cap = tierData
            ? tierData.cap
            : 50;


        var base = Math.max(
            18,
            cap - randomInt(5,22)
        );


        var player = {

            id: makeId(),

            name: makeName(),

            origin: origin,

            position: randomItem(positions),

            age:
                origin === "youth"
                    ? randomInt(13,18)
                    : origin === "university"
                        ? randomInt(18,23)
                        : randomInt(19,34),

            state: randomItem(states),

            university:
                origin === "university"
                    ? randomItem(fictionalUniversities)
                    : null,

            tier: tier,

            potentialCap: cap,

            shooting:
                Math.min(
                    cap,
                    Math.max(
                        1,
                        base + randomInt(-4,8)
                    )
                ),

            dribbling:
                Math.min(
                    cap,
                    Math.max(
                        1,
                        base + randomInt(-6,7)
                    )
                ),

            passing:
                Math.min(
                    cap,
                    Math.max(
                        1,
                        base + randomInt(-5,8)
                    )

            defense:

                    cap,
                    Math.max(
                        1,
                        base + randomInt(-7,7)

                    cap,
                    Math.max(
                        1,
                        base + randomInt(-5,8)
                    )
                ),

            iq:

                    cap,
                    Math.max(
                        1,
                        base + randomInt(-5,7)
                    )
                ),

            strength:

                    cap,
                    Math.max(
                        1,
                        base + randomInt(-5,7)
                    )
                ),

            salary: randomInt(4500,18000),

            marketValue: randomInt(4500,75000),

            locked: false,

            selected: false,

            scoutingTeams: [],

            scoutingLevel: "Initial",

            academyEligible:
                origin === "youth",

            contractStatus:
                origin === "university"
                    ? "University Ball"
                    : origin === "youth"
                        ? "Youth Prospect"
                        : "Free Agent",

            abilities: []

        };


        /* Youth abilities */

        if (origin === "youth") {

            if (Math.random() < .12)
                player.abilities.push(
                    "Rapid Learner"
                );

            if (Math.random() < .08)
                player.abilities.push(
                    "Raw Creator"
                );

            if (Math.random() < .05)
                player.abilities.push(
                    "Competitive Motor"
                );

            if (Math.random() < .015)
                player.abilities.push(
                    "Gem Development Pattern"
                );

            if (tier.indexOf("DIAMOND") !== -1)
                player.abilities.push(
                    "Generational Youth Projection"

        /* University abilities */

        if (origin === "university") {

            if (Math.random() < .12)
                player.abilities.push(
                    "College Floor General"

            if (Math.random() < .08)
                player.abilities.push(
                    "Transition Specialist"
                );

            if (Math.random() < .05)
                player.abilities.push(
                    "Defensive Instinct"
                );

        }


        return player;

    }


    /* ========================================================
       INITIALIZE WORLD
       ======================================================== */

    function initializeWorld() {

        if (state.initialized)
            return;


        /* Existing teams */

        state.teams.forEach(function(team) {

            for (var i = 0; i < 8; i++) {

                team.roster.push(
                    createPlayer("professional")
                );

            }

        });


        /* University Ball */

        for (var u = 0; u < 18; u++) {

            var universityPlayer =
                createPlayer("university");

            universityPlayer.scoutingTeams =
                randomScoutingTeams();

            state.universityPlayers.push(
                universityPlayer
            );

        }


        /* Youth */

        for (var y = 0; y < 14; y++) {

            state.youthPlayers.push(
                createPlayer("youth")
            );

        }


        /* Free agents */

        for (var f = 0; f < 8; f++) {

            state.freeAgents.push(
                createPlayer("professional")
            );

        }


        /* Auction */

        createLiveAuction();


        state.initialized = true;


        updateFunds();

    }


    function randomScoutingTeams() {

        var output = [];

        state.teams.forEach(function(team) {

            if (Math.random() < .30)
                output.push(team.name);

        });

        return output;

    }


    /* ========================================================
       PLAYER SEARCH
       ======================================================== */

    function findPlayer(id) {

        id = Number(id);

        var found = null;


        state.teams.forEach(function(team) {

            team.roster.forEach(function(player) {

                if (Number(player.id) === id)
                    found = player;

            });

        });


        state.universityPlayers.forEach(function(player) {

            if (Number(player.id) === id)
                found = player;

        });


        state.youthPlayers.forEach(function(player) {

            if (Number(player.id) === id)
                found = player;

        });


        state.freeAgents.forEach(function(player) {

            if (Number(player.id) === id)
                found = player;

        });


        state.liveAuctions.forEach(function(auction) {

            if (
                auction.player &&
                Number(auction.player.id) === id
            ) {
                found = auction.player;
            }

        });


        return found;

    }

    function stat(label,value) {

        return (

    function skill(name,value) {

        var pct =
            Math.min(
                100,
                Math.max(
                    0,
                    (Number(value) / 80) * 100
                )
            );


        return (

            '<div class="mc-skill-row">' +

                '<span>' +
                    escapeHtml(name) +
                '</span>' +

                '<div class="mc-skill-track">' +

                    '<div ' +
                        'class="mc-skill-fill" ' +
                        'style="width:' +

            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");

    function bid(id,amount) {

        var auction =
            state.liveAuctions.find(
                function(a) {
                    return a.id === Number(id);
                }
            );


        if (
            !auction ||
            !auction.active
        )
            return;


        var nextBid =
            auction.currentBid +
            Number(amount);


        if (nextBid > state.funds) {

            alert(
                "Insufficient club funds."
            );

            return;

        }


        auction.currentBid =
            nextBid;


        auction.highBidder =
            state.userTeam.name;


        liveAuctionHub();

    }


    var auctionTimerStarted = false;


    function startAuctionTimer() {

        if (auctionTimerStarted)
            return;


        auctionTimerStarted = true;


        setInterval(function() {

            state.liveAuctions.forEach(function(auction) {

                if (!auction.active)
                    return;


                auction.seconds--;


                if (auction.seconds <= 0) {

                    auction.seconds = 0;

                    auction.active = false;


                    if (
                        auction.highBidder ===
                        state.userTeam.name
                    ) {

                        if (
                            state.funds >=
                            auction.currentBid
                        ) {

                            state.funds -=
                                auction.currentBid;


                            auction.player.contractStatus =
                                "Motor City Hustle Contract";


                            state.teams[0].roster.push(
                                auction.player
                            );


                            updateFunds();

                        }

                    }

                }

            });


            document
                .querySelectorAll(
                    "[id^='mc-auction-clock-']"
                )
                .forEach(function(el) {

                    var id =
                        Number(
                            el.id.replace(
                                "mc-auction-clock-",
                                ""
                            )
                        );


                    var auction =
                        state.liveAuctions.find(
                            function(a) {
                                return a.id === id;
                            }
                        );


                    if (auction) {

                        el.innerText =
                            formatTime(
                                auction.seconds
                            );

                    }

                });

        },1000);

    }


    function formatTime(seconds) {

        var m =
            Math.floor(
                seconds / 60
            );


        var s =
            seconds % 60;


        return (
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );

    }

    function trainPlayer(id,skillName) {

        var player =
            findPlayer(id);


        if (!player)
            return;


        var allowedSkills = [

            "shooting",
            "defense",
            "athleticism",
            "dribbling",
            "passing",
            "finishing",
            "iq",
            "strength"

        ];


        if (
            allowedSkills.indexOf(
                skillName
            ) === -1
        )
            return;


        if (
            Number(
                player[skillName]
            ) >=
            Number(
                player.potentialCap
            )
        ) {

            alert(

                player.name +
                " has reached the current potential limit in " +
                skillName +
                "."

            );

            return;

        }


        player[skillName] =

            Math.min(

                player.potentialCap,

                Number(
                    (
                        Number(
                            player[skillName]
                        ) +
                        .2
                    ).toFixed(1)
                )

            );


        state.trainingLog.push({

            player:
                player.id,

            skill:
                skillName,

            date:
                new Date().toISOString()

        });


        trainingHub();

    }

    /* ========================================================
       EXISTING PLAYER CARD CONNECTION
       ======================================================== */

    function bindExistingPlayerCards() {

        var cards =
            document.querySelectorAll(
                ".player-card"
            );


        cards.forEach(function(card,index) {

            if (
                card.dataset.mcBound === "1"
            )
                return;


            card.dataset.mcBound = "1";


            card.addEventListener(
                "click",
                function(event) {

                    /*
                     * Do not change the card's appearance.
                     * We only attach functionality.
                     */

                    var player = null;


                    /*
                     * First try common data attributes.
                     */

                    var possibleId =
                        card.getAttribute(
                            "data-player-id"
                        );


                    if (!possibleId) {

                        possibleId =
                            card.getAttribute(
                                "data-id"
                            );

                    }


                    if (possibleId)
                        player =
                            findPlayer(
                                possibleId
                            );


                    /*
                     * If no ID exists, use roster position.
                     */

                    if (!player) {

                        player =
                            state.teams[0]
                                .roster[index];

                    }


                    if (player)
                        openPlayer(player);

                }
            );

        });

    }


    /* ========================================================
       WATCH FOR DYNAMIC PLAYER CARDS
       ======================================================== */

    function watchForPlayerCards() {

        bindExistingPlayerCards();


        if (
            typeof MutationObserver ===
            "undefined"
        )
            return;


        var observer =
            new MutationObserver(
                function() {

                    bindExistingPlayerCards();

                }
            );


        if (document.body) {

            observer.observe(
                document.body,
                {
                    childList: true,
                    subtree: true
                }
            );

        }

    }
