<script>
/* ============================================================
   MASTER CONTROL ENGINE
   ============================================================ */

var MC = (function () {

    /* ----------------------------------------------------------
       CENTRAL WORLD STATE
       ---------------------------------------------------------- */

    var state = {

        funds: 145200,

        userTeam: {
            id: 948204,
            name: "Motor City Hustle"
        },

        teams: [
            {

            },

        trainingLog: [],

        nextAuctionId: 1
    };


    /* ----------------------------------------------------------
       FICTIONAL NAME / SCHOOL DATA
       ---------------------------------------------------------- */

    var firstNames = [
        "Marcus","Darius","Jalen","Terrence","Malik",
        "Devin","Andre","Caleb","Isaiah","Jordan",
        "Cameron","Travis","Kendrick","Mason","Tyrese",
        "Evan","Dante","Jaylen","Micah","Noah"
    ];

    var lastNames = [
        "Rivers","Hayes","Stallings","Carter","Monroe",
        "Bennett","Griffin","Lawson","Maddox","Reed",
        "Whitaker","Banks","Holloway","Parker","Dawson",
        "Ellis","Warren","McCall","Foster","Bradley"
    ];

    var fictionalUniversities = [
        "North Valley Institute",
        "Great Lakes Technical",
        "Western Prairie University",
        "Capital Heights College",
        "Atlantic Plains University",
        "Redwood State Institute",
        "Central Metro University",
        "Blue Ridge Technical",
        "River County University",
        "Heartland College",
        "Northern Frontier Institute",
        "Pioneer Valley University"
    ];

    var states = [
        "Michigan",
        "Virginia",
        "Ohio",
        "Indiana",
        "Illinois",
        "Georgia",
        "Texas",
        "Florida",
        "Arizona",
        "Colorado",
        "Oregon",
        "Pennsylvania",
        "Tennessee",
        "North Carolina"
    ];

    var positions = [
        "PG",
        "SG",
        "SF",
        "PF",
        "C"
    ];


    /* ----------------------------------------------------------
       TIER RULES
       
       IMPORTANT:
       UNIVERSITY BALL NEVER GETS DIAMOND.
       
       YOUTH DIAMOND/GEM EVENTS ARE EXTREMELY RARE.
       ---------------------------------------------------------- */

    var tiers = [
        {name:"SNUCK", cap:20, color:"#4b5563"},
        {name:"TIN", cap:35, color:"#64748b"},
        {name:"COPPER", cap:45, color:"#b45309"},
        {name:"SILVER", cap:50, color:"#94a3b8"},
        {name:"OPAL", cap:55, color:"#06b6d4"},
        {name:"EMERALD", cap:60, color:"#10b981"},
        {name:"GOLD", cap:65, color:"#d97706"},
        {name:"PLATINUM", cap:70, color:"#3b82f6"},
        {name:"WHITE DIAMOND", cap:74, color:"#94a3b8"},
        {name:"BLACK DIAMOND", cap:75, color:"#111827"},
        {name:"RED DIAMOND", cap:80, color:"#dc2626"}
    ];


    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }


    function randomInt(min,max) {
        return Math.floor(Math.random() * (max-min+1))+min;
    }


    function makeName() {
        return randomItem(firstNames) + " " + randomItem(lastNames);
    }


    function makeId() {
        state.nextPlayerId++;
        return state.nextPlayerId;
    }


    /* ----------------------------------------------------------
       TIER ASSIGNMENT
       ---------------------------------------------------------- */

    function universityTier() {

        /*
         * University Ball:
         * NEVER Diamond.
         */

        var roll = Math.random();

        if (roll < .04) return "PLATINUM";
        if (roll < .15) return "GOLD";
        if (roll < .34) return "EMERALD";
        if (roll < .57) return "OPAL";
        if (roll < .76) return "SILVER";
        if (roll < .90) return "COPPER";

        return "TIN";
    }


    function youthTier() {

        /*
         * Youth:
         * Diamond-class potential is possible,
         * but exceptionally rare.
         */

        var roll = Math.random();

        if (roll < .0005) return "RED DIAMOND";
        if (roll < .0020) return "BLACK DIAMOND";
        if (roll < .0060) return "WHITE DIAMOND";
        if (roll < .03) return "PLATINUM";
        if (roll < .12) return "GOLD";
        if (roll < .30) return "EMERALD";
        if (roll < .55) return "OPAL";
        if (roll < .75) return "SILVER";

        return "COPPER";
    }


    function professionalTier() {

        var roll = Math.random();

        if (roll < .0002) return "RED DIAMOND";
        if (roll < .001) return "BLACK DIAMOND";
        if (roll < .005) return "WHITE DIAMOND";
        if (roll < .025) return "PLATINUM";
        if (roll < .12) return "GOLD";
        if (roll < .35) return "EMERALD";
        if (roll < .58) return "OPAL";
        if (roll < .75) return "SILVER";

        return "COPPER";
    }


    /* ----------------------------------------------------------
       PLAYER GENERATOR
       ---------------------------------------------------------- */

    function createPlayer(origin) {

        var tier;

        if (origin === "university") {
            tier = universityTier();
        }
        else if (origin === "youth") {
            tier = youthTier();
        }
        else {
            tier = professionalTier();
        }

        var tierData = tiers.find(function(t){
            return t.name === tier;
        });

        var cap = tierData ? tierData.cap : 50;

        var base = Math.max(18, cap-randomInt(5,22));

        var player = {

            id: makeId(),

            name: makeName(),

            origin: origin,

            position: randomItem(positions),

            age:
                origin === "youth"
                ? randomInt(13,18)
                : origin === "university"
                ? randomInt(18,23)
                : randomInt(19,34),

            state: randomItem(states),

            university:
                origin === "university"
                ? randomItem(fictionalUniversities)
                : null,

            tier: tier,

            potentialCap: cap,

            shooting: Math.min(cap, base+randomInt(-4,8)),

            dribbling: Math.min(cap, base+randomInt(-6,7)),

            passing: Math.min(cap, base+randomInt(-5,8)),

            defense: Math.min(cap, base+randomInt(-7,7)),

            athleticism: Math.min(cap, base+randomInt(-5,8)),

            finishing: Math.min(cap, base+randomInt(-5,8)),

            iq: Math.min(cap, base+randomInt(-5,7)),

            strength: Math.min(cap, base+randomInt(-5,7)),

            salary: randomInt(4500,18000),

            marketValue: randomInt(4500,75000),

            locked: false,

            selected: false,

            scoutingTeams: [],

            scoutingLevel: "Initial",

            academyEligible: origin === "youth",

            contractStatus:
                origin === "university"
                ? "University Ball"
                : origin === "youth"
                ? "Youth Prospect"
                : "Free Agent"
        };

        /*
         * Youth rare abilities are different from pro abilities.
         */

        player.abilities = [];

        if (origin === "youth") {

            if (Math.random() < .12)
                player.abilities.push("Rapid Learner");

            if (Math.random() < .08)
                player.abilities.push("Raw Creator");

            if (Math.random() < .05)
                player.abilities.push("Competitive Motor");

            if (Math.random() < .015)
                player.abilities.push("Gem Development Pattern");

            if (tier.indexOf("DIAMOND") !== -1)
                player.abilities.push("Generational Youth Projection");
        }

        if (origin === "university") {

            if (Math.random() < .12)
                player.abilities.push("College Floor General");

            if (Math.random() < .08)
                player.abilities.push("Transition Specialist");

            if (Math.random() < .05)
                player.abilities.push("Defensive Instinct");

        }

        return player;
    }


    /* ----------------------------------------------------------
       WORLD INITIALIZATION
       ---------------------------------------------------------- */

    function initializeWorld() {

        /*
         * Give EVERY franchise players.
         */

        state.teams.forEach(function(team){

            if (team.roster.length > 0) return;

            for (var i=0;i<8;i++) {

                var p = createPlayer("professional");

                team.roster.push(p);

            }

        });


        /*
         * University Ball scouting pipeline.
         */

        for (var u=0;u<18;u++) {

            var universityPlayer = createPlayer("university");

            universityPlayer.scoutingTeams = randomScoutingTeams();

            state.universityPlayers.push(universityPlayer);

        }


        /*
         * Youth Academy pipeline.
         */

        for (var y=0;y<14;y++) {

            state.youthPlayers.push(createPlayer("youth"));

        }


        /*
         * Free agents.
         */

        for (var f=0;f<8;f++) {

            state.freeAgents.push(createPlayer("professional"));

        }


        /*
         * One rotating live auction.
         */

        createLiveAuction();

    }


    function randomScoutingTeams() {

        var output = [];

        state.teams.forEach(function(team){

            if (Math.random() < .30)
                output.push(team.name);

        });

        return output;

    }


    /* ----------------------------------------------------------
       CLICK EXISTING PLAYER CARDS
       ---------------------------------------------------------- */

    function bindExistingPlayerCards() {

        /*
         * IMPORTANT:
         * We don't replace the user's cards.
         * We simply make them clickable.
         */

        var cards = document.querySelectorAll(".player-card");

        cards.forEach(function(card,index){

            if (card.dataset.mcBound === "1") return;

            card.dataset.mcBound = "1";
            card.classList.add("masterball-clickable");

            card.addEventListener("click",function(){

                /*
                 * If the existing card has an ID, try to locate it.
                 * Otherwise show the corresponding roster player.
                 */

                var player = state.teams[0].roster[index];

                if (player)
                    openPlayer(player);

            });

        });

    }

    }

        state.youthPlayers.forEach(function(p){

    function selectYouth(id) {

        var p = findPlayer(id);

        if (!p || p.origin !== "youth") return;

        if (p.selected) {

            alert("This prospect is already assigned to your Youth Academy.");

            return;

        }

        /*

            p.name +

    /* ----------------------------------------------------------

       ---------------------------------------------------------- */

    function createLiveAuction() {

        var player = createPlayer("professional");

        state.liveAuctions.push({

            id: state.nextAuctionId++,

            player: player,

            currentBid: Math.max(5000,player.marketValue),

            highBidder: "Opening Market",

            seconds: randomInt(45,90),

            active: true

        });

    }


    function liveAuctionHub() {

        var body = document.getElementById("hub-window-body");

        document.getElementById("hub-window-title").innerText =
            "Live Auction — Timed Bidding";

        if (!state.liveAuctions.length)
            createLiveAuction();

        var html =

            '<div class="hub-box">' +

            '<h4>LIVE AUCTION</h4>' +

            '<p style="font-size:11px;">' +

            'This is a competitive timed auction. Clubs bid against one another until the timer expires.' +

            '</p>' +

            '</div>';

        state.liveAuctions.forEach(function(a){

            if (!a.active) return;

            html +=

                '<div class="hub-box" style="margin-top:8px;">' +

                '<h4>' +
                a.player.name +
                '</h4>' +

                '<span class="market-badge market-live">LIVE AUCTION</span>' +

                '<div class="auction-clock" id="auction-clock-' +
                a.id +
                '">' +
                formatTime(a.seconds) +
                '</div>' +

                '<div class="bid-display">' +

                'Current Bid: $' +
                a.currentBid.toLocaleString() +

                '</div>' +

                '<div style="text-align:center;">' +

                '<button class="hub-action primary" onclick="MC.bid(' +
                a.id +
                ',5000)">Bid +$5K</button>' +

                '<button class="hub-action primary" onclick="MC.bid(' +
                a.id +
                ',10000)">Bid +$10K</button>' +

                '</div>' +

                '<div style="font-size:10px;text-align:center;">' +

                'High Bidder: ' +
                a.highBidder +

                '</div>' +

                '</div>';

        });

        body.innerHTML = html;

        openWindow("hub-window-overlay");

        startAuctionTimer();

    }


    function bid(id,amount) {

        var auction = state.liveAuctions.find(function(a){
            return a.id === id;
        });

        if (!auction || !auction.active) return;

        var nextBid = auction.currentBid + amount;

        if (nextBid > state.funds) {

            alert("Insufficient club funds.");

            return;

        }

        auction.currentBid = nextBid;

        auction.highBidder = state.userTeam.name;

        liveAuctionHub();

    }


    var auctionTimerStarted = false;

    function startAuctionTimer() {

        if (auctionTimerStarted) return;

        auctionTimerStarted = true;

        setInterval(function(){

            state.liveAuctions.forEach(function(a){

                if (!a.active) return;

                a.seconds--;

                if (a.seconds <= 0) {

                    a.seconds = 0;
                    a.active = false;

                    if (a.highBidder === state.userTeam.name) {

                        if (state.funds >= a.currentBid) {

                            state.funds -= a.currentBid;

                            state.teams[0].roster.push(a.player);

                            updateFunds();

                        }

                    }

                }

            });

            var clocks =
                document.querySelectorAll("[id^='auction-clock-']");

            clocks.forEach(function(el){

                var id = parseInt(
                    el.id.replace("auction-clock-","")
                );

                var a = state.liveAuctions.find(function(x){
                    return x.id === id;
                });

                if (a)
                    el.innerText = formatTime(a.seconds);

            });

        },1000);

    }


    function formatTime(seconds) {

        var m = Math.floor(seconds/60);
        var s = seconds%60;

        return (
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );

    }

    function buyFreeAgent(id) {

        var index = state.freeAgents.findIndex(function(p){
            return p.id === id;
        });

        if (index === -1) return;

        var p = state.freeAgents[index];

        if (state.funds < p.marketValue) {

            alert("Club funds are insufficient.");

            return;

        }

        state.funds -= p.marketValue;

        p.contractStatus = "Motor City Hustle Contract";

        state.teams[0].roster.push(p);

        state.freeAgents.splice(index,1);

        updateFunds();

        freeAgentHub();

    }


    /* ----------------------------------------------------------
       MARKET MACRO ENGINE
       ---------------------------------------------------------- */

    function marketHub() {

        var shooters = 0;
        var bigs = 0;
        var total = 0;

        state.teams.forEach(function(team){

            team.roster.forEach(function(p){

                total++;

                if (
                    p.position === "PG" ||
                    p.position === "SG"
                )
                    shooters++;
                else
                    bigs++;

            });

        });

        var shooterPct = total ?
            Math.round((shooters/total)*100)
            : 50;

        var bigPct = 100-shooterPct;

        var climate =
            shooterPct > 70
            ? "SHOOTER OVERSUPPLY / PAINT DROUGHT"
            : bigPct > 70
            ? "BIG-MAN OVERSUPPLY / WING DROUGHT"
            : "STABLE EQUILIBRIUM";

        var body = document.getElementById("hub-window-body");

        document.getElementById("hub-window-title").innerText =
            "Macro Market Conditions";

        body.innerHTML =

            '<div class="hub-grid">' +

            '<div class="hub-box">' +

    function trainPlayer(id,skillName) {

        var p = findPlayer(id);

        if (!p) return;

        if (p[skillName] >= p.potentialCap) {

            alert(
                p.name +
                " has reached the current potential limit in " +
                skillName +
                "."
            );

            return;

        }

        p[skillName] =
            Math.min(
                p.potentialCap,
                parseFloat((p[skillName]+.2).toFixed(1))
            );

        state.trainingLog.push({
            player:id,
            skill:skillName,
            date:new Date().toISOString()
        });

        trainingHub();

    }

    /* ----------------------------------------------------------

       ---------------------------------------------------------- */

    function findPlayer(id) {

        var found = null;

        state.teams.forEach(function(team){

            team.roster.forEach(function(p){

                if (p.id === id)
                    found = p;

            });

        });

        state.universityPlayers.forEach(function(p){

            if (p.id === id)
                found = p;

        });

        state.youthPlayers.forEach(function(p){

            if (p.id === id)
                found = p;

        });

        state.freeAgents.forEach(function(p){

            if (p.id === id)
                found = p;

        });

        state.liveAuctions.forEach(function(a){

            if (a.player.id === id)
                found = a.player;

        });

        return found;

    }


    function openById(id) {

        var p = findPlayer(id);

        if (p)
            openPlayer(p);

    }

    function openWindow(id) {

        var el = document.getElementById(id);

        if (el)
            el.classList.add("open");

        var el = document.getElementById(id);
