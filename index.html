<script>
/* ============================================================
   MOTOR CITY HUSTLE — MASTER CONTROL ENGINE
   FIXED VERSION
   ------------------------------------------------------------
   - Initializes the world correctly
   - Training works
   - Player cards become clickable
   - Auctions work
   - Free agents work
   - Youth Academy works
   - University Ball works
   - Keeps existing UI/colors intact
   ============================================================ */

var MC = (function () {

    /* =========================================================
       WORLD STATE
       ========================================================= */

    var state = {
        initialized: false,

        funds: 145200,

        userTeam: {
            id: 948204,
            name: "Motor City Hustle"
        },

        teams: [
            {
                id: 948204,
                name: "Motor City Hustle",
                city: "Motor City",
                roster: []
            },
            {
                id: 110284,
                name: "Lakeview Forge",
                city: "Lakeview",
                roster: []
            },
            {
                id: 220391,
                name: "Capital Comets",
                city: "Capital",
                roster: []
            },
            {
                id: 330492,
                name: "Rivergate Royals",
                city: "Rivergate",
                roster: []
            },
            {
                id: 440583,
                name: "Prairie Storm",
                city: "Prairie",
                roster: []
            },
            {
                id: 550674,
                name: "Atlantic Foundry",
                city: "Atlantic",
                roster: []
            }
        ],

        universityPlayers: [],
        youthPlayers: [],
        freeAgents: [],
        liveAuctions: [],
        scoutingLocks: {},
        trainingLog: [],

        nextPlayerId: 70000000,
        nextAuctionId: 1
    };


    /* =========================================================
       DATA
       ========================================================= */

    var firstNames = [
        "Marcus","Darius","Jalen","Terrence","Malik",
        "Devin","Andre","Caleb","Isaiah","Jordan",
        "Cameron","Travis","Kendrick","Mason","Tyrese",
        "Evan","Dante","Jaylen","Micah","Noah"
    ];

    var lastNames = [
        "Rivers","Hayes","Stallings","Carter","Monroe",
        "Bennett","Griffin","Lawson","Maddox","Reed",
        "Whitaker","Banks","Holloway","Parker","Dawson",
        "Ellis","Warren","McCall","Foster","Bradley"
    ];

    var fictionalUniversities = [
        "North Valley Institute",
        "Great Lakes Technical",
        "Western Prairie University",
        "Capital Heights College",
        "Atlantic Plains University",
        "Redwood State Institute",
        "Central Metro University",
        "Blue Ridge Technical",
        "River County University",
        "Heartland College",
        "Northern Frontier Institute",
        "Pioneer Valley University"
    ];

    var states = [
        "Michigan",
        "Virginia",
        "Ohio",
        "Indiana",
        "Illinois",
        "Georgia",
        "Texas",
        "Florida",
        "Arizona",
        "Colorado",
        "Oregon",
        "Pennsylvania",
        "Tennessee",
        "North Carolina"
    ];

    var positions = [
        "PG",
        "SG",
        "SF",
        "PF",
        "C"
    ];

    var tiers = [
        {name:"SNUCK", cap:20, color:"#4b5563"},
        {name:"TIN", cap:35, color:"#64748b"},
        {name:"COPPER", cap:45, color:"#b45309"},
        {name:"SILVER", cap:50, color:"#94a3b8"},
        {name:"OPAL", cap:55, color:"#06b6d4"},
        {name:"EMERALD", cap:60, color:"#10b981"},
        {name:"GOLD", cap:65, color:"#d97706"},
        {name:"PLATINUM", cap:70, color:"#3b82f6"},
        {name:"WHITE DIAMOND", cap:74, color:"#94a3b8"},
        {name:"BLACK DIAMOND", cap:75, color:"#111827"},
        {name:"RED DIAMOND", cap:80, color:"#dc2626"}
    ];


    /* =========================================================
       HELPERS
       ========================================================= */

    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function makeName() {
        return randomItem(firstNames) + " " + randomItem(lastNames);
    }

    function makeId() {
        state.nextPlayerId++;
        return state.nextPlayerId;
    }

    function getTier(name) {
        return tiers.find(function(t) {
            return t.name === name;
        });
    }


    /* =========================================================
       TIER GENERATION
       ========================================================= */

    function universityTier() {

        var roll = Math.random();

        if (roll < .04) return "PLATINUM";
        if (roll < .15) return "GOLD";
        if (roll < .34) return "EMERALD";
        if (roll < .57) return "OPAL";
        if (roll < .76) return "SILVER";
        if (roll < .90) return "COPPER";

        return "TIN";
    }

    function youthTier() {

        var roll = Math.random();

        if (roll < .0005) return "RED DIAMOND";
        if (roll < .0020) return "BLACK DIAMOND";
        if (roll < .0060) return "WHITE DIAMOND";
        if (roll < .03) return "PLATINUM";
        if (roll < .12) return "GOLD";
        if (roll < .30) return "EMERALD";
        if (roll < .55) return "OPAL";
        if (roll < .75) return "SILVER";

        return "COPPER";
    }

    function professionalTier() {

        var roll = Math.random();

        if (roll < .0002) return "RED DIAMOND";
        if (roll < .001) return "BLACK DIAMOND";
        if (roll < .005) return "WHITE DIAMOND";
        if (roll < .025) return "PLATINUM";
        if (roll < .12) return "GOLD";
        if (roll < .35) return "EMERALD";
        if (roll < .58) return "OPAL";
        if (roll < .75) return "SILVER";

        return "COPPER";
    }


    /* =========================================================
       PLAYER CREATION
       ========================================================= */

    function createPlayer(origin) {

        var tier;

        if (origin === "university") {
            tier = universityTier();
        } else if (origin === "youth") {
            tier = youthTier();
        } else {
            tier = professionalTier();
        }

        var tierData = getTier(tier);
        var cap = tierData ? tierData.cap : 50;

        var base = Math.max(
            18,
            cap - randomInt(5, 22)
        );

        var player = {

            id: makeId(),

            name: makeName(),

            origin: origin,

            position: randomItem(positions),

            age:
                origin === "youth"
                    ? randomInt(13,18)
                    : origin === "university"
                        ? randomInt(18,23)
                        : randomInt(19,34),

            state: randomItem(states),

            university:
                origin === "university"
                    ? randomItem(fictionalUniversities)
                    : null,

            tier: tier,

            potentialCap: cap,

            shooting: Math.min(cap, Math.max(1, base + randomInt(-4,8))),
            dribbling: Math.min(cap, Math.max(1, base + randomInt(-6,7))),
            passing: Math.min(cap, Math.max(1, base + randomInt(-5,8))),
            defense: Math.min(cap, Math.max(1, base + randomInt(-7,7))),
            athleticism: Math.min(cap, Math.max(1, base + randomInt(-5,8))),
            finishing: Math.min(cap, Math.max(1, base + randomInt(-5,8))),
            iq: Math.min(cap, Math.max(1, base + randomInt(-5,7))),
            strength: Math.min(cap, Math.max(1, base + randomInt(-5,7))),

            salary: randomInt(4500,18000),

            marketValue: randomInt(4500,75000),

            locked: false,

            selected: false,

            scoutingTeams: [],

            scoutingLevel: "Initial",

            academyEligible: origin === "youth",

            contractStatus:
                origin === "university"
                    ? "University Ball"
                    : origin === "youth"
                        ? "Youth Prospect"
                        : "Free Agent",

            abilities: []
        };


        /* Youth abilities */

        if (origin === "youth") {

            if (Math.random() < .12)
                player.abilities.push("Rapid Learner");

            if (Math.random() < .08)
                player.abilities.push("Raw Creator");

            if (Math.random() < .05)
                player.abilities.push("Competitive Motor");

            if (Math.random() < .015)
                player.abilities.push("Gem Development Pattern");

            if (tier.indexOf("DIAMOND") !== -1)
                player.abilities.push(
                    "Generational Youth Projection"
                );
        }


        /* University abilities */

        if (origin === "university") {

            if (Math.random() < .12)
                player.abilities.push(
                    "College Floor General"
                );

            if (Math.random() < .08)
                player.abilities.push(
                    "Transition Specialist"
                );

            if (Math.random() < .05)
                player.abilities.push(
                    "Defensive Instinct"
                );
        }

        return player;
    }


    /* =========================================================
       WORLD INITIALIZATION
       ========================================================= */

    function initializeWorld() {

        if (state.initialized)
            return;

        state.initialized = true;


        /* Professional rosters */

        state.teams.forEach(function(team) {

            for (var i = 0; i < 8; i++) {

                team.roster.push(
                    createPlayer("professional")
                );

            }

        });


        /* University pipeline */

        for (var u = 0; u < 18; u++) {

            var universityPlayer =
                createPlayer("university");

            universityPlayer.scoutingTeams =
                randomScoutingTeams();

            state.universityPlayers.push(
                universityPlayer
            );
        }


        /* Youth */

        for (var y = 0; y < 14; y++) {

            state.youthPlayers.push(
                createPlayer("youth")
            );

        }


        /* Free agents */

        for (var f = 0; f < 8; f++) {

            state.freeAgents.push(
                createPlayer("professional")
            );

        }


        /* Auction */

        createLiveAuction();

        updateFunds();
    }


    function randomScoutingTeams() {

        var output = [];

        state.teams.forEach(function(team) {

            if (Math.random() < .30)
                output.push(team.name);

        });

        return output;
    }


    /* =========================================================
       PLAYER CARD CONNECTION
       ========================================================= */

    function bindExistingPlayerCards() {

        var cards =
            document.querySelectorAll(".player-card");

        cards.forEach(function(card, index) {

            if (card.dataset.mcBound === "1")
                return;

            card.dataset.mcBound = "1";

            card.classList.add(
                "masterball-clickable"
            );


            card.addEventListener(
                "click",
                function(e) {

                    /*
                     * Don't interfere with buttons
                     * already inside the player's card.
                     */

                    if (
                        e.target.closest &&
                        e.target.closest("button,a,input,select")
                    ) {
                        return;
                    }

                    var player =
                        state.teams[0].roster[index];

                    if (player)
                        openPlayer(player);
                }
            );

        });
    }


    /* =========================================================
       PLAYER DETAIL
       ========================================================= */

    function openPlayer(player) {

        if (!player)
            return;

        var body =
            document.getElementById(
                "player-detail-body"
            );

        if (!body)
            return;

        var tier = getTier(player.tier);

        var color =
            tier
                ? tier.color
                : "#2c3e50";


        var abilities =
            player.abilities.length
                ? player.abilities.map(function(a) {

                    return (
                        '<span class="market-badge market-youth">' +
                        a +
                        '</span>'
                    );

                }).join("")
                :
                '<span style="font-size:11px;color:#777;">' +
                'No special ability discovered.' +
                '</span>';


        var scouting =
            player.scoutingTeams.length
                ? player.scoutingTeams.map(function(t) {

                    return (
                        '<span class="interest-team">' +
                        t +
                        '</span>'
                    );

                }).join("")
                :
                '<span style="font-size:11px;">' +
                'No competing team currently recorded.' +
                '</span>';


        body.innerHTML =

            '<div class="hub-grid">' +

            '<div class="hub-box">' +

            '<h4>Masterball Card</h4>' +

            '<div style="font-size:20px;font-weight:bold;color:#2c3e50;">' +
            player.name +
            '</div>' +

            '<div style="margin:5px 0;">' +

            '<span class="detail-tier" style="background:' +
            color +
            ';">' +

            player.tier +

            '</span>' +

            '</div>' +

            stat("ID", player.id) +
            stat("Position", player.position) +
            stat("Age", player.age) +
            stat("Origin", player.origin) +
            stat("State", player.state) +

            (
                player.university
                    ? stat(
                        "University Ball",
                        player.university
                    )
                    : ""
            ) +

            '</div>' +


            '<div class="hub-box">' +

            '<h4>Player Economics</h4>' +

            stat(
                "Weekly Salary",
                "$" + player.salary.toLocaleString()
            ) +

            stat(
                "Market Value",
                "$" + player.marketValue.toLocaleString()
            ) +

            stat(
                "Potential Cap",
                player.potentialCap
            ) +

            stat(
                "Contract",
                player.contractStatus
            ) +

            '</div>' +

            '</div>' +


            '<div class="hub-box" style="margin-top:10px;">' +

            '<h4>Skill Profile</h4>' +

            skill("Shooting", player.shooting) +
            skill("Dribbling", player.dribbling) +
            skill("Passing", player.passing) +
            skill("Defense", player.defense) +
            skill("Athleticism", player.athleticism) +
            skill("Finishing", player.finishing) +
            skill("Basketball IQ", player.iq) +
            skill("Strength", player.strength) +

            '</div>' +


            '<div class="hub-grid" style="margin-top:10px;">' +

            '<div class="hub-box">' +

            '<h4>Abilities</h4>' +

            abilities +

            '</div>' +

            '<div class="hub-box">' +

            '<h4>Scouting Interest</h4>' +

            scouting +

            '</div>' +

            '</div>' +


            '<div style="margin-top:10px;text-align:right;">' +

            '<button class="hub-action primary" ' +
            'onclick="MC.lockScouting(' +
            player.id +
            ')">' +

            (
                player.locked
                    ? "🔒 Scouting Locked"
                    : "🔎 Lock This Scouting File"
            ) +

            '</button>' +

            '</div>';


        var title =
            document.getElementById(
                "detail-title"
            );

        if (title)
            title.innerText =
                "Masterball Card — " +
                player.name;


        openWindow(
            "player-detail-overlay"
        );
    }


    function stat(label, value) {

        return (
            '<div class="hub-stat">' +
            '<span>' + label + '</span>' +
            '<strong>' + value + '</strong>' +
            '</div>'
        );
    }


    function skill(name, value) {

        var pct =
            Math.min(
                100,
                (value / 80) * 100
            );

        return (

            '<div class="skill-row">' +

            '<span>' +
            name +
            '</span>' +

            '<div class="skill-track">' +

            '<div class="skill-fill" style="width:' +
            pct +
            '%"></div>' +

            '</div>' +

            '<strong>' +
            value +
            '</strong>' +

            '</div>'
        );
    }


    /* =========================================================
       SCOUTING
       ========================================================= */

    function lockScouting(id) {

        var p = findPlayer(id);

        if (!p)
            return;

        p.locked = !p.locked;

        state.scoutingLocks[id] =
            p.locked;

        openPlayer(p);
    }


    /* =========================================================
       UNIVERSITY HUB
       ========================================================= */

    function universityHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );

        document.getElementById(
            "hub-window-title"
        ).innerText =
            "University Ball Scouting Pipeline";


        var html =

            '<div class="hub-box">' +

            '<h4>Fictional University Ball Pipeline</h4>' +

            '<p style="font-size:11px;">' +

            'Every review is a separate fictional prospect unless the scouting file is locked. ' +
            'University Ball players cannot generate Diamond-tier players.' +

            '</p>' +

            '<span class="market-badge market-university">' +
            'FICTIONAL SCHOOLS ONLY' +
            '</span>' +

            '<span class="market-badge market-university">' +
            'NO DIAMOND CLASS' +
            '</span>' +

            '</div>';


        state.universityPlayers.forEach(
            function(p) {

                html +=

                    '<div class="player-mini-card" ' +
                    'onclick="MC.openById(' +
                    p.id +
                    ')">' +

                    '<strong>' +
                    p.name +
                    '</strong>' +

                    ' — ' +
                    p.position +

                    '<br>' +

                    '<span style="font-size:10px;">' +

                    p.university +
                    ' • ' +
                    p.state +
                    ' • Age ' +
                    p.age +

                    '</span>' +

                    '<br>' +

                    '<span class="market-badge market-university">' +
                    p.tier +
                    '</span>' +

                    '<span class="market-badge">' +
                    p.scoutingTeams.length +
                    ' competing teams</span>' +

                    '</div>';
            }
        );


        body.innerHTML = html;

        openWindow(
            "hub-window-overlay"
        );
    }


    /* =========================================================
       YOUTH ACADEMY
       ========================================================= */

    function youthAcademyHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );

        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Youth Academy";


        var html =

            '<div class="hub-box">' +

            '<h4>Youth Development Pipeline</h4>' +

            '<p style="font-size:11px;">' +

            'Youth prospects can develop abilities that are different from professional players. ' +
            'Diamond-class potential is extremely rare.' +

            '</p>' +

            '</div>';


        state.youthPlayers.forEach(
            function(p) {

                html +=

                    '<div class="player-mini-card">' +

                    '<strong>' +
                    p.name +
                    '</strong>' +

                    ' — ' +
                    p.position +

                    '<br>' +

                    '<span style="font-size:10px;">' +

                    p.state +
                    ' • Age ' +
                    p.age +

                    '</span>' +

                    '<br>' +

                    '<span class="market-badge market-youth">' +
                    p.tier +
                    '</span>' +

                    '<button class="hub-action success" ' +
                    'onclick="MC.selectYouth(' +
                    p.id +
                    ')">' +

                    (
                        p.selected
                            ? "Academy Selected"
                            : "Select for Academy"
                    ) +

                    '</button>' +

                    '</div>';
            }
        );


        body.innerHTML = html;

        openWindow(
            "hub-window-overlay"
        );
    }


    function selectYouth(id) {

        var p = findPlayer(id);

        if (!p || p.origin !== "youth")
            return;

        if (p.selected) {

            alert(
                "This prospect is already assigned to your Youth Academy."
            );

            return;
        }

        p.selected = true;

        p.contractStatus =
            "Youth Academy";


        alert(
            p.name +
            " has been accepted into the Motor City Youth Academy."
        );


        youthAcademyHub();
    }


    /* =========================================================
       LIVE AUCTION
       ========================================================= */

    function createLiveAuction() {

        var player =
            createPlayer("professional");

        state.liveAuctions.push({

            id:
                state.nextAuctionId++,

            player:
                player,

            currentBid:
                Math.max(
                    5000,
                    player.marketValue
                ),

            highBidder:
                "Opening Market",

            seconds:
                randomInt(45,90),

            active:
                true
        });
    }


    function liveAuctionHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );

        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Live Auction — Timed Bidding";


        if (!state.liveAuctions.length)
            createLiveAuction();


        var html =

            '<div class="hub-box">' +

            '<h4>LIVE AUCTION</h4>' +

            '<p style="font-size:11px;">' +

            'Competitive timed auction. Clubs bid against one another until the timer expires.' +

            '</p>' +

            '</div>';


        state.liveAuctions.forEach(
            function(a) {

                if (!a.active)
                    return;

                html +=

                    '<div class="hub-box" style="margin-top:8px;">' +

                    '<h4>' +
                    a.player.name +
                    '</h4>' +

                    '<span class="market-badge market-live">' +
                    'LIVE AUCTION' +
                    '</span>' +

                    '<div class="auction-clock" id="auction-clock-' +
                    a.id +
                    '">' +

                    formatTime(a.seconds) +

                    '</div>' +

                    '<div class="bid-display">' +

                    'Current Bid: $' +
                    a.currentBid.toLocaleString() +

                    '</div>' +

                    '<div style="text-align:center;">' +

                    '<button class="hub-action primary" ' +
                    'onclick="MC.bid(' +
                    a.id +
                    ',5000)">' +

                    'Bid +$5K' +

                    '</button>' +

                    '<button class="hub-action primary" ' +
                    'onclick="MC.bid(' +
                    a.id +
                    ',10000)">' +

                    'Bid +$10K' +

                    '</button>' +

                    '</div>' +

                    '<div style="font-size:10px;text-align:center;">' +

                    'High Bidder: ' +
                    a.highBidder +

                    '</div>' +

                    '</div>';
            }
        );


        body.innerHTML = html;

        openWindow(
            "hub-window-overlay"
        );

        startAuctionTimer();
    }


    function bid(id, amount) {

        var auction =
            state.liveAuctions.find(
                function(a) {
                    return a.id === id;
                }
            );

        if (!auction || !auction.active)
            return;


        var nextBid =
            auction.currentBid +
            amount;


        if (nextBid > state.funds) {

            alert(
                "Insufficient club funds."
            );

            return;
        }


        auction.currentBid =
            nextBid;

        auction.highBidder =
            state.userTeam.name;


        liveAuctionHub();
    }


    var auctionTimerStarted = false;


    function startAuctionTimer() {

        if (auctionTimerStarted)
            return;

        auctionTimerStarted = true;


        setInterval(function() {

            state.liveAuctions.forEach(
                function(a) {

                    if (!a.active)
                        return;

                    a.seconds--;


                    if (a.seconds <= 0) {

                        a.seconds = 0;

                        a.active = false;


                        if (
                            a.highBidder ===
                            state.userTeam.name
                        ) {

                            if (
                                state.funds >=
                                a.currentBid
                            ) {

                                state.funds -=
                                    a.currentBid;

                                a.player.contractStatus =
                                    "Motor City Hustle Contract";

                                state.teams[0].roster.push(
                                    a.player
                                );

                                updateFunds();
                            }
                        }
                    }
                }
            );


            var clocks =
                document.querySelectorAll(
                    "[id^='auction-clock-']"
                );


            clocks.forEach(function(el) {

                var id =
                    parseInt(
                        el.id.replace(
                            "auction-clock-",
                            ""
                        ),
                        10
                    );


                var a =
                    state.liveAuctions.find(
                        function(x) {
                            return x.id === id;
                        }
                    );


                if (a)
                    el.innerText =
                        formatTime(a.seconds);
            });


        }, 1000);
    }


    function formatTime(seconds) {

        var m =
            Math.floor(seconds / 60);

        var s =
            seconds % 60;


        return (
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );
    }


    /* =========================================================
       FREE AGENTS
       ========================================================= */

    function freeAgentHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );

        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Free-Agent Market";


        var html =

            '<div class="hub-box">' +

            '<h4>FREE-AGENT CONTRACT MARKET</h4>' +

            '<p style="font-size:11px;">' +

            'Fixed-price market. No countdown and no bidding.' +

            '</p>' +

            '<span class="market-badge market-free">' +
            'FIXED MARKET' +
            '</span>' +

            '</div>';


        state.freeAgents.forEach(
            function(p) {

                html +=

                    '<div class="player-mini-card">' +

                    '<strong>' +
                    p.name +
                    '</strong>' +

                    ' — ' +
                    p.position +

                    '<br>' +

                    '<span style="font-size:10px;">' +

                    p.tier +
                    ' • Age ' +
                    p.age +

                    '</span>' +

                    '<br>' +

                    '<span class="market-badge market-free">' +

                    '$' +
                    p.marketValue.toLocaleString() +

                    '</span>' +

                    '<button class="hub-action primary" ' +
                    'onclick="MC.buyFreeAgent(' +
                    p.id +
                    ')">' +

                    'Buy Contract' +

                    '</button>' +

                    '</div>';
            }
        );


        body.innerHTML = html;

        openWindow(
            "hub-window-overlay"
        );
    }


    function buyFreeAgent(id) {

        var index =
            state.freeAgents.findIndex(
                function(p) {
                    return p.id === id;
                }
            );


        if (index === -1)
            return;


        var p =
            state.freeAgents[index];


        if (
            state.funds <
            p.marketValue
        ) {

            alert(
                "Club funds are insufficient."
            );

            return;
        }


        state.funds -=
            p.marketValue;


        p.contractStatus =
            "Motor City Hustle Contract";


        state.teams[0].roster.push(p);

        state.freeAgents.splice(
            index,
            1
        );


        updateFunds();

        freeAgentHub();
    }


    /* =========================================================
       MARKET
       ========================================================= */

    function marketHub() {

        initializeWorld();

        var shooters = 0;
        var bigs = 0;
        var total = 0;


        state.teams.forEach(
            function(team) {

                team.roster.forEach(
                    function(p) {

                        total++;

                        if (
                            p.position === "PG" ||
                            p.position === "SG"
                        )
                            shooters++;
                        else
                            bigs++;
                    }
                );
            }
        );


        var shooterPct =
            total
                ? Math.round(
                    (shooters / total) * 100
                )
                : 50;


        var bigPct =
            100 - shooterPct;


        var climate =
            shooterPct > 70
                ? "SHOOTER OVERSUPPLY / PAINT DROUGHT"
                : bigPct > 70
                    ? "BIG-MAN OVERSUPPLY / WING DROUGHT"
                    : "STABLE EQUILIBRIUM";


        var body =
            document.getElementById(
                "hub-window-body"
            );


        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Macro Market Conditions";


        body.innerHTML =

            '<div class="hub-grid">' +

            '<div class="hub-box">' +

            '<h4>Roster Census</h4>' +

            stat(
                "Shooting Positions",
                shooterPct + "%"
            ) +

            stat(
                "Paint Positions",
                bigPct + "%"
            ) +

            '</div>' +

            '<div class="hub-box">' +

            '<h4>Market Climate</h4>' +

            '<strong>' +
            climate +
            '</strong>' +

            '<p style="font-size:10px;">' +

            'Supply and demand influence player valuation across the world market.' +

            '</p>' +

            '</div>' +

            '</div>' +

            '<div class="hub-box" style="margin-top:10px;">' +

            '<h4>Market Rule</h4>' +

            '<p style="font-size:11px;">' +

            'If too many clubs develop the same archetype, that archetype becomes less scarce. Scarce player profiles gain market leverage.' +

            '</p>' +

            '</div>';


        openWindow(
            "hub-window-overlay"
        );
    }


    /* =========================================================
       TRAINING — FIXED
       ========================================================= */

    function trainingHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );


        if (!body)
            return;


        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Weekly Training";


        var html =

            '<div class="hub-box">' +

            '<h4>Roster Training Controller</h4>' +

            '<p style="font-size:11px;">' +

            'Training operates on the same player objects used by the roster, scouting, market and match systems.' +

            '</p>' +

            '</div>';


        state.teams[0].roster.forEach(
            function(p) {

                html +=

                    '<div class="player-mini-card">' +

                    '<strong>' +
                    p.name +
                    '</strong>' +

                    ' — ' +
                    p.position +

                    '<br>' +

                    '<span style="font-size:10px;">' +

                    p.tier +
                    ' • Potential ' +
                    p.potentialCap +

                    '</span>' +

                    '<br>' +

                    '<span style="font-size:10px;">' +

                    'Shooting: ' +
                    p.shooting +
                    ' | Defense: ' +
                    p.defense +
                    ' | Athleticism: ' +
                    p.athleticism +

                    '</span>' +

                    '<br>' +

                    '<button class="hub-action" ' +
                    'onclick="MC.trainPlayer(' +
                    p.id +
                    ',\'shooting\')">' +

                    'Shooting +' +

                    '</button>' +

                    '<button class="hub-action" ' +
                    'onclick="MC.trainPlayer(' +
                    p.id +
                    ',\'defense\')">' +

                    'Defense +' +

                    '</button>' +

                    '<button class="hub-action" ' +
                    'onclick="MC.trainPlayer(' +
                    p.id +
                    ',\'athleticism\')">' +

                    'Athleticism +' +

                    '</button>' +

                    '</div>';
            }
        );


        body.innerHTML = html;


        openWindow(
            "hub-window-overlay"
        );
    }


    function trainPlayer(id, skillName) {

        initializeWorld();


        var allowedSkills = [
            "shooting",
            "defense",
            "athleticism"
        ];


        if (
            allowedSkills.indexOf(skillName) === -1
        )
            return;


        var p =
            findPlayer(id);


        if (!p)
            return;


        if (
            typeof p[skillName] !== "number"
        )
            return;


        if (
            p[skillName] >=
            p.potentialCap
        ) {

            alert(
                p.name +
                " has reached the current potential limit in " +
                skillName +
                "."
            );

            return;
        }


        p[skillName] =
            Math.min(
                p.potentialCap,
                Number(
                    (
                        p[skillName] + .2
                    ).toFixed(1)
                )
            );


        state.trainingLog.push({

            player:
                id,

            skill:
                skillName,

            date:
                new Date().toISOString()
        });


        trainingHub();
    }


    /* =========================================================
       DRAFT
       ========================================================= */

    function draftHub() {

        initializeWorld();

        var body =
            document.getElementById(
                "hub-window-body"
            );


        document.getElementById(
            "hub-window-title"
        ).innerText =
            "Live Draft Board";


        body.innerHTML =

            '<div class="hub-box">' +

            '<h4>Draft Board</h4>' +

            '<p style="font-size:11px;">' +

            'Draft prospects are pulled from the fictional University Ball pipeline.' +

            '</p>' +

            '<button class="hub-action primary" ' +
            'onclick="MC.universityHub()">' +

            'Open University Scouting' +

            '</button>' +

            '</div>';


        openWindow(
            "hub-window-overlay"
        );
    }


    /* =========================================================
       FIND PLAYER
       ========================================================= */

    function findPlayer(id) {

        var found = null;


        state.teams.forEach(
            function(team) {

                team.roster.forEach(
                    function(p) {

                        if (p.id === id)
                            found = p;

                    }
                );
            }
        );


        state.universityPlayers.forEach(
            function(p) {

                if (p.id === id)
                    found = p;

            }
        );


        state.youthPlayers.forEach(
            function(p) {

                if (p.id === id)
                    found = p;

            }
        );


        state.freeAgents.forEach(
            function(p) {

                if (p.id === id)
                    found = p;

            }
        );


        state.liveAuctions.forEach(
            function(a) {

                if (
                    a.player &&
                    a.player.id === id
                )
                    found = a.player;

            }
        );


        return found;
    }


    function openById(id) {

        var p =
            findPlayer(id);

        if (p)
            openPlayer(p);
    }


    /* =========================================================
       WINDOWS
       ========================================================= */

    function openWindow(id) {

        var el =
            document.getElementById(id);

        if (el)
            el.classList.add("open");
    }


    function closeWindow(id) {

        var el =
            document.getElementById(id);

        if (el)
            el.classList.remove("open");
    }


    /* =========================================================
       FUNDS
       ========================================================= */

    function updateFunds() {

        var el =
            document.getElementById(
                "funds-txt"
            );


        if (el) {

            el.innerText =
                state.funds.toLocaleString();

        }
    }


    /* =========================================================
       BOOT / REFRESH CONNECTION
       ========================================================= */

    function boot() {

        initializeWorld();

        bindExistingPlayerCards();

        updateFunds();
    }


    function reconnectCards() {

        bindExistingPlayerCards();
    }


    /* =========================================================
       PUBLIC API
       ========================================================= */

    return {

        boot: boot,

        reconnectCards:
            reconnectCards,

        openPlayer:
            openPlayer,

        openById:
            openById,

        lockScouting:
            lockScouting,

        universityHub:
            universityHub,

        youthAcademyHub:
            youthAcademyHub,

        liveAuctionHub:
            liveAuctionHub,

        freeAgentHub:
            freeAgentHub,

        marketHub:
            marketHub,

        trainingHub:
            trainingHub,

        draftHub:
            draftHub,

        buyFreeAgent:
            buyFreeAgent,

        bid:
            bid,

        selectYouth:
            selectYouth,

        trainPlayer:
            trainPlayer,

        closeWindow:
            closeWindow
    };

})();

   SAFE GLOBAL NAVIGATION FUNCTIONS

/* ============================================================
   START ENGINE
   ============================================================ */

(function() {

    function startMC() {

        MC.boot();

        /*
         * Give the existing page a moment to finish
         * rendering its roster.
         */

        setTimeout(function() {
            MC.reconnectCards();
        }, 300);


        /*
         * If your original page adds player cards later,
         * automatically reconnect them.
         */

        if (
            window.MutationObserver &&
            document.body
        ) {

            var observer =
                new MutationObserver(
                    function() {

                        MC.reconnectCards();

                    }
                );


            observer.observe(
                document.body,
                {
                    childList: true,
                    subtree: true
                }
            );
        }
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startMC
        );

    } else {

        startMC();

    }

})();
